# nginx config for the SPA + backend reverse proxy.
# /api/ is proxied to the backend service (no trailing slash on proxy_pass, so
# the /api/ prefix is preserved — the backend routes are all /api/...).
# Everything else falls back to index.html (client-side routing).
#
# The backend host is parametrized via $BACKEND_HOST (envsubst at container
# start — the nginx:alpine entrypoint runs 20-envsubst-on-templates.sh over
# /docker-entrypoint.d/*.template). Default "backend" keeps the single-app RFC
# setup working unchanged; MOP's frontend service sets BACKEND_HOST=mop-backend.
#
# This file is read directly when no .template variant exists. To enable
# envsubst, this same content lives in nginx.conf.template (copied into the
# image) so the runtime substitution applies. See Dockerfile.frontend.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://${BACKEND_HOST}:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI draft/review call the LLM, which can take minutes on a slow or
        # self-hosted model. nginx's default proxy_read_timeout is 60s → the
        # request returns 504 before the backend finishes. A review-section
        # request may hold up to two LLM calls of REVIEW_LLM_TIMEOUT_MS
        # (default 240s) each, so give LLM-backed endpoints ample room.
        # Tune down if you only use fast hosted models.
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # index.html must never be cached so frontend deploys reach browsers instantly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Content-hashed assets are immutable — cache them aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
